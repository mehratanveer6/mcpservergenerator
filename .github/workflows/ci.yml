name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,runtime]"
      - name: Unit and end-to-end tests
        run: pytest -q
      - name: Spec doctor on the example
        run: python -m mcpforge doctor examples/petclinic.yaml --fail-under 80
      - name: Generate the example server
        run: python -m mcpforge generate examples/petclinic.yaml -o /tmp/petclinic-mcp
