openapi: 3.0.3
info:
  title: Pet Clinic API
  version: 1.2.0
  description: Example API used by the MCPForge tests and documentation.
servers:
  - url: http://localhost:8765/api/v1
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Pet:
      type: object
      required: [name, species]
      properties:
        id: {type: integer, readOnly: true}
        name: {type: string, description: Pet name}
        species: {type: string, enum: [dog, cat, bird, rabbit]}
        age: {type: integer, description: Age in years}
        owner_id: {type: integer, description: Owner identifier}
security:
  - apiKeyAuth: []
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      description: Returns pets registered at the clinic, optionally filtered by species.
      tags: [pets]
      parameters:
        - {name: species, in: query, schema: {type: string, enum: [dog, cat, bird, rabbit]}, description: Filter by species}
        - {name: limit, in: query, schema: {type: integer, default: 20}, description: Maximum number of results}
      responses: {"200": {description: OK}}
    post:
      operationId: createPet
      summary: Register a new pet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Pet'}
      responses: {"201": {description: Created}}
  /pets/{petId}:
    parameters:
      - {name: petId, in: path, required: true, schema: {type: integer}, description: Pet identifier}
    get:
      operationId: getPet
      summary: Get a pet by id
      tags: [pets]
      responses: {"200": {description: OK}}
    put:
      operationId: updatePet
      summary: Update a pet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Pet'}
      responses: {"200": {description: OK}}
    delete:
      operationId: deletePet
      summary: Delete a pet record
      tags: [pets]
      responses: {"204": {description: Deleted}}
  /pets/search:
    post:
      operationId: searchPets
      summary: Search pets by free text
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: {type: string, description: Text to match against name and species}
      responses: {"200": {description: OK}}
  /appointments:
    get:
      operationId: listAppointments
      summary: List appointments
      tags: [appointments]
      parameters:
        - {name: date, in: query, schema: {type: string, format: date}, description: Day to list (YYYY-MM-DD)}
      responses: {"200": {description: OK}}
    post:
      operationId: bookAppointment
      summary: Book an appointment for a pet
      tags: [appointments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pet_id, date]
              properties:
                pet_id: {type: integer}
                date: {type: string, format: date}
                reason: {type: string}
      responses: {"201": {description: Created}}
  /appointments/{appointmentId}/cancel:
    post:
      operationId: cancelAppointment
      summary: Cancel an appointment
      tags: [appointments]
      parameters:
        - {name: appointmentId, in: path, required: true, schema: {type: integer}}
      responses: {"200": {description: Cancelled}}
  /owners/{ownerId}:
    get:
      operationId: getOwner
      summary: Get an owner and their pets
      tags: [owners]
      parameters:
        - {name: ownerId, in: path, required: true, schema: {type: integer}}
      responses: {"200": {description: OK}}
