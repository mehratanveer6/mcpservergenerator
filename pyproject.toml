[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpforge"
version = "1.0.0"
description = "Generate safe, curated Model Context Protocol servers from OpenAPI specifications, with an ML risk classifier and AWS (SageMaker, Bedrock) integration"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Tanveer Mehra"}]
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "jinja2>=3.1",
  "pandas>=2.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "joblib>=1.3",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
runtime = ["mcp>=2.3,<3", "httpx>=0.27", "pydantic>=2.7"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "matplotlib>=3.8", "mcp>=2.3,<3", "httpx>=0.27", "uvicorn>=0.30", "starlette>=0.37"]

[project.scripts]
mcpforge = "mcpforge.cli:main"

[tool.setuptools.packages.find]
include = ["mcpforge*"]

[tool.setuptools.package-data]
mcpforge = ["templates/*.j2", "models/*.joblib", "models/*.json", "runtime/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
